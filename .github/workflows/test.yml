name: test

# Gate for every branch: the deck data must validate, the unit suite must pass, and
# the app must still build. Deploying is deploy.yml's job, on its own branch list.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Validate character decks
        run: node validate-character-decks.js

      - name: Unit tests
        working-directory: app
        run: npx ng test --watch=false --browsers=ChromeHeadless

      # Catches what the unit suite cannot: AOT template type errors, and anything
      # that only breaks in a production build.
      - name: Build
        working-directory: app
        run: npx ng build --configuration production
