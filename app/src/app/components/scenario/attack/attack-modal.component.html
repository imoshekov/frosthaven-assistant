<div class="layout"></div>
<div class="modal">
    <div class="content">
        <div class="name">{{this.appContext.isGroupSelected && creature.aggressive ? creature.type : creature.name}}
        </div>
        <div class="character-selector" *ngIf="!appContext.isGroupSelected">
            <div class="characters">
                <div *ngFor="let hero of getHeroes()"
                     class="character-slot"
                     [class.selected]="selectedCharacterId === hero.id"
                     (click)="selectCharacter(hero.id || null)">
                    <img [src]="attackerPortrait(hero)"
                         [title]="hero.name"
                         (error)="$event.target.src='./images/bb/daemon-skull.svg'" />
                </div>
            </div>
        </div>
        <app-buffs [creature]="creature" *ngIf="this.appContext.isGroupSelected"></app-buffs>
        <div class="attack" *ngIf="!this.appContext.isGroupSelected">
            <div class="attack-inputs">
                <div class="stat">
                    <div class="icon damage"></div>
                    <input type="tel" [(ngModel)]="attack" (ngModelChange)="calculateDamage()" maxlength="3"
                        class="stat-input" />
                </div>
                <div class="stat">
                    <div class="icon pierce"></div>
                    <input type="tel" [(ngModel)]="armorPen" (ngModelChange)="calculateDamage()" maxlength="3"
                        [disabled]="ignoreArmor" class="stat-input" />
                    <button type="button" class="ignore-armor-btn" [class.active]="ignoreArmor"
                        (click)="toggleIgnoreArmor()"
                        [title]="ignoreArmor ? 'Ignoring the target\'s armor — click to stop' : 'Ignore the target\'s armor entirely'">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9c-4-1.5-7-4.5-7-9V6l7-3z" />
                            <path d="M9.5 8l2 3l-2.5 2l3 3.5" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="damage-preview">
                total: {{ damage || 0 }}
            </div>
            <!-- Retaliate is provoked by the attack itself, so it applies even when the
                 attack misses or is fully blocked. Only the range is the player's call,
                 this app having no board to measure it on. -->
            <label class="retaliate-row" *ngIf="retaliateDamage > 0 && selectedCharacterId">
                <input type="checkbox" [checked]="applyRetaliate" (change)="toggleRetaliate()" />
                <span>
                    Retaliate {{ retaliateDamage }}<ng-container *ngIf="creature.retaliateRange > 1"> (range {{ creature.retaliateRange }})</ng-container>
                    back at the attacker
                </span>
            </label>
        </div>
        <app-conditions *ngIf="!appContext.isGroupSelected" [creature]="creature" [conditions]="conditions"
            [immunities]="creature.immunities" [shouldShowBuffs]="shouldShowBuffs"
            (conditionToggled)="toggleCondition($event)">
        </app-conditions>

        <p class="custom-hint" *ngIf="openedFromCardPanel">
            These values are applied when you click Execute back on the card.
        </p>
        <div class="buttons">
            <button type="button" class="cancel" (click)="close()">Cancel</button>
            <button type="button" class="confirm" (click)="confirm()" [disabled]="!appContext.isGroupSelected && !selectedCharacterId">Confirm</button>
        </div>
    </div>
</div>
